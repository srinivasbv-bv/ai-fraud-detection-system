# Logstash Pipeline Configuration for AI-Powered Fraud Detection System
input {
  file {
    path => "C:/Users/Srinivas/.gemini/antigravity/scratch/ai_fraud_detection_system/logs/transactions.ndjson"
    start_position => "beginning"
    sincedb_path => "NUL"
    codec => "json"
  }
}

filter {
  mutate {
    add_field => { "environment" => "production" }
    rename => { "[fraud_detection][risk_score]" => "risk_score_numeric" }
  }
  date {
    match => [ "@timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "fraud-detection-events-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
