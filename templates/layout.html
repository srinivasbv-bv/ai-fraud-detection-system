<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Fraud Detection System{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
                <div class="d-flex align-items-center mb-4 ps-2">
                    <i class="fa-solid fa-shield-halved text-info fa-2x me-2"></i>
                    <span class="fs-5 font-bold text-light">FraudGuard AI</span>
                </div>
                <hr class="text-secondary">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                            <i class="fa-solid fa-chart-line"></i> Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="/simulator" class="nav-link {% if request.path == '/simulator' %}active{% endif %}">
                            <i class="fa-solid fa-bolt"></i> Live Simulator
                        </a>
                    </li>
                    <li>
                        <a href="/queue" class="nav-link {% if request.path == '/queue' %}active{% endif %}">
                            <i class="fa-solid fa-list-check"></i> Analyst Queue
                        </a>
                    </li>
                    <li>
                        <a href="/metrics" class="nav-link {% if request.path == '/metrics' %}active{% endif %}">
                            <i class="fa-solid fa-brain"></i> Model Metrics
                        </a>
                    </li>
                    <li>
                        <a href="/framework" class="nav-link {% if request.path == '/framework' %}active{% endif %}">
                            <i class="fa-solid fa-book-bookmark"></i> OWASP & PCI Matrix
                        </a>
                    </li>
                </ul>
                <hr class="text-secondary mt-5">
                <div class="small text-muted ps-2">
                    <i class="fa-solid fa-university me-1"></i> MSc CS Project<br>
                    Karnataka State Open Univ.
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Main JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
